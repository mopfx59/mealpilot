<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MealPilot</title><link rel="stylesheet" href="/static/style.css"></head>
<body><header><div><span class="logo">🍲</span><h1>MealPilot</h1><p>Votre semaine, simplement bien cuisinée.</p></div></header>
<nav><button data-view="planning" class="active">Planning</button><button data-view="recipes">Recettes</button><button data-view="shopping">Courses</button></nav><main>
<section id="planning" class="view active"><div class="section-head"><div><h2>Menu de la semaine</h2><p>Cliquez sur un repas pour le choisir ou le remplacer.</p></div><div class="week-nav"><button id="prev">‹</button><strong id="week"></strong><button id="next">›</button></div></div><div id="planner" class="planner"></div></section>
<section id="recipes" class="view"><div class="section-head"><div><h2>Mes recettes</h2><p>Vos idées favorites toujours à portée de main.</p></div><button class="primary" id="new-recipe">＋ Ajouter</button></div><div id="recipe-list" class="cards"></div></section>
<section id="shopping" class="view"><div class="section-head"><div><h2>Liste de courses</h2><p>Cochez, modifiez ou supprimez les articles.</p></div></div><form id="shopping-form" class="inline-form"><input name="label" placeholder="Article" required><input name="quantity" placeholder="Quantité"><button class="primary">Ajouter</button></form><div id="shopping-list" class="shopping"></div></section>
</main><dialog id="meal-dialog"><form method="dialog"><button class="close">×</button><h3>Choisir une recette</h3><div id="meal-options" class="meal-options"></div></form></dialog>
<dialog id="recipe-dialog"><form id="recipe-form"><button type="button" class="close">×</button><h3>Nouvelle recette</h3><label>Nom<input name="name" required></label><label>Ingrédients (un par ligne)<textarea name="ingredients" rows="6"></textarea></label><label>Préparation<textarea name="instructions" rows="6"></textarea></label><button class="primary">Enregistrer</button></form></dialog>
<dialog id="detail-dialog"><button class="close">×</button><div id="recipe-detail"></div></dialog><div id="toast"></div><script src="/static/app.js"></script></body></html>
